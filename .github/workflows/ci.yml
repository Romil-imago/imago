name: verify
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log(JSON.stringify({
            summary: audit.metadata?.vulnerabilities ?? null,
            packages: Object.entries(audit.vulnerabilities ?? {}).map(([name, item]) => ({
              name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable
            }))
          }, null, 2));
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
